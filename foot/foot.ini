[main]
font=Terminess Nerd Font Mono:size=12
dpi-aware=no
shell=/home/neon/.npm-global/bin/agent-sh --backend opencode
term=foot
selection-target=both

[scrollback]
lines=10000

[cursor]
style=block
blink=yes

[colors-dark]
alpha=0.92
cursor=282828 bf616a

## Void Vibe — dark, muted, purple/magenta accents
foreground=d8d8d8
background=050508

## Black
regular0=1c1c24
bright0=383846

## Red
regular1=bf616a
bright1=d4777f

## Green
regular2=a3be8c
bright2=b8d4a3

## Yellow
regular3=ebcb8b
bright3=e8d5a3

## Blue
regular4=81a1c1
bright4=8fbcbb

## Magenta (Void accent)
regular5=b48ead
bright5=c7a0c8

## Cyan
regular6=88c0be
bright6=8fbcbb

## White
regular7=e5e5e5
bright7=ffffff

[bell]
urgent=yes
notify=yes

[mouse]
hide-when-typing=yes



[key-bindings]
search-start=Control+Shift+r
