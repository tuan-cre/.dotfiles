[main]
font = Terminess Nerd Font Mono:size=12
use-bold = yes
dpi-aware = yes
width = 30
lines = 12
placeholder = "Run: "
prompt = "❯ "
icons-enabled = yes
icon-theme = Papirus
layer = overlay
anchor = center
x-margin = 0
y-margin = 0
horizontal-pad = 8
vertical-pad = 8
border-width = 2
border-radius = 8

[colors]
background = 050508cc
text = d8d8d8ff
